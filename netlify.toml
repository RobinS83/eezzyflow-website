[build]
  command = "npm run build"
  publish = "out"
  # Netlify credits are limited (shared with surocad3d.com). Skip the build
  # when only docs, notes or the project rules changed: they don't change the site.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)CLAUDE.md' ':(exclude)README.md'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# One address for everyone: eezzyflow.be and the www variants all land on
# https://eezzyflow.com, keeping the path. These rules only apply once the
# domains are added to the Netlify site (see docs/domeinen.md).
[[redirects]]
  from = "https://eezzyflow.be/*"
  to = "https://eezzyflow.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eezzyflow.be/*"
  to = "https://eezzyflow.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eezzyflow.com/*"
  to = "https://eezzyflow.com/:splat"
  status = 301
  force = true

# Old or mistyped Dutch URLs with the default prefix go to the root.
[[redirects]]
  from = "/nl"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/nl/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Until launch: keep the preview out of search engines. Remove this line
    # when eezzyflow.com goes live (see CLAUDE.md, "Hosting").
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
